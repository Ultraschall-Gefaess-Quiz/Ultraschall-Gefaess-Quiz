<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        header {
            padding: 20px;
            background-color: #2196F3; /* Changed to blue */
            color: white;
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }
        header img {
            max-width: 100px;
            display: block;
            margin: 0 auto;
        }
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
        }
        .language-switcher button {
            border: none;
            background: none;
            cursor: pointer;
            padding: 5px 0;
        }
        .language-switcher img {
            width: 50px;
            height: 25px;
        }
        .calendar-container {
            width: 100%;
            max-width: 800px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .calendar {
            display: inline-block;
            border-collapse: collapse;
            width: 100%;
            margin: 20px auto;
        }
        .calendar th, .calendar td {
            border: 1px solid #999;
            padding: 20px;
            text-align: center;
            min-width: 80px;
        }
        .month {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .month-name {
            text-align: center;
            margin: 0 10px;
        }
        .month button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .day-header {
            background-color: #f2f2f2;
        }
        .day {
            height: 120px;
            vertical-align: top;
            position: relative;
        }
        .today {
            background-color: #ffeb3b;
        }
        .event {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            background-color: #2196F3;
            color: white;
            padding: 2px;
            border-radius: 3px;
            font-size: 12px;
        }
        .separator {
            border-top: 1px solid #2196F3;
            width: 100%;
            margin: 40px 0;
        }
        .about-us {
            width: 100%;
            max-width: 800px;
            padding: 0 10px;
            box-sizing: border-box;
            text-align: left;
        }
        .about-us h2 {
            text-align: center;
        }
        @media (max-width: 600px) {
            .day {
                height: 80px;
            }
            .calendar th, .calendar td {
                padding: 10px;
                min-width: 60px;
            }
            header img {
                max-width: 80px;
            }
            header {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Ultraschall-Gefaess-Quiz Logo">
        <div class="language-switcher">
            <button onclick="setLanguage('de')"><img src="DE.png" alt="DE"></button>
            <button onclick="setLanguage('en')"><img src="ENG.png" alt="EN"></button>
        </div>
        <h1 id="title">Willkommen beim Ultraschall-Gefäß-Quiz</h1>
        <p id="description">Dies ist eine einfache Projektwebsite, die auf GitHub Pages mit dem Minima-Theme gehostet wird.</p>
    </header>

    <div class="calendar-container">
        <div id="calendar-container"></div>
    </div>

    <div class="separator"></div>

    <div class="about-us">
        <h2 id="about-title">Über uns</h2>
        <p id="about-description">Hier können Sie Ihr Team vorstellen. Beschreiben Sie Ihre Teammitglieder und deren Rolle im Projekt.</p>
    </div>

    <script>
        const events = {
            "2024-06-07": { title: "Medical Quiz Event 1", color: "#FF5722" },
            "2024-06-15": { title: "Medical Quiz Event 2", color: "#4CAF50" },
            // Add more events here
        };

        const translations = {
            "de": {
                "title": "Willkommen beim Ultraschall-Gefäß-Quiz",
                "description": "Dies ist eine einfache Projektwebsite, die auf GitHub Pages mit dem Minima-Theme gehostet wird.",
                "previous": "<",
                "next": ">",
                "monthNames": ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"],
                "dayNames": ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"],
                "aboutTitle": "Über uns",
                "aboutDescription": "Hier können Sie Ihr Team vorstellen. Beschreiben Sie Ihre Teammitglieder und deren Rolle im Projekt."
            },
            "en": {
                "title": "Welcome to Ultrasound Vessel Quiz",
                "description": "This is a simple project website hosted on GitHub Pages using the Minima theme.",
                "previous": "<",
                "next": ">",
                "monthNames": ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
                "dayNames": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
                "aboutTitle": "About Us",
                "aboutDescription": "Here you can introduce your team. Describe your team members and their role in the project."
            }
        };

        let currentLanguage = 'de';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function setLanguage(language) {
            currentLanguage = language;
            document.getElementById('title').innerText = translations[language].title;
            document.getElementById('description').innerText = translations[language].description;
            document.getElementById('about-title').innerText = translations[language].aboutTitle;
            document.getElementById('about-description').innerText = translations[language].aboutDescription;
            renderCalendar(currentMonth, currentYear);
        }

        function renderCalendar(month, year) {
            const calendarContainer = document.getElementById('calendar-container');
            calendarContainer.innerHTML = generateCalendarHTML(month, year);
        }

        function generateCalendarHTML(month, year) {
            const date = new Date(year, month);
            const monthName = translations[currentLanguage].monthNames[month];
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const dayNames = translations[currentLanguage].dayNames;

            let html = `
                <table class="calendar">
                    <tr class="month">
                        <button class="prev" onclick="prevMonth()">${translations[currentLanguage].previous}</button>
                        <div class="month-name">${monthName} ${year}</div>
                        <button class="next" onclick="nextMonth()">${translations[currentLanguage].next}</button>
                    </tr>
                    <tr class="day-header">
                        ${dayNames.map(day => `<th>${day}</th>`).join('')}
                    </tr>
                    <tr>
            `;
            for (let i = 0; i < firstDay; i++) {
                html += `<td class="day"></td>`;
            }
            for (let day = 1; day <= lastDate; day++) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += `<td class="day${dateString === new Date().toISOString().slice(0, 10) ? ' today' : ''}">`;
                html += day;
                if (events[dateString]) {
                    html += `<div class="event" style="background-color: ${events[dateString].color};">${events[dateString].title}</div>`;
                }
                html += `</td>`;
                if ((day + firstDay) % 7 === 0) {
                    html += `</tr><tr>`;
                }
            }
            html += `</tr></table>`;
            return html;
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(currentMonth, currentYear);
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar(currentMonth, currentYear);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLanguage);
        });
    </script>
</body>
</html>
