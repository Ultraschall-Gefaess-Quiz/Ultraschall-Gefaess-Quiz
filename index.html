<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 20px;
            background-color: #4CAF50;
            color: white;
        }
        header img {
            max-width: 100px;
            display: block;
            margin: 0 auto;
        }
        .calendar {
            display: inline-block;
            border-collapse: collapse;
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
        }
        .calendar th, .calendar td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }
        .month {
            text-align: center;
            font-size: 24px;
            padding: 10px;
        }
        .day-header {
            background-color: #f2f2f2;
        }
        .day {
            height: 120px;
            vertical-align: top;
            position: relative;
        }
        .today {
            background-color: #ffeb3b;
        }
        .event {
            position: absolute;
            bottom: 5px;
            left: 5px;
            right: 5px;
            background-color: #2196F3;
            color: white;
            padding: 2px;
            border-radius: 3px;
            font-size: 12px;
        }
        .navigation {
            margin: 20px 0;
        }
        .navigation button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
        }
        .language-switcher {
            margin: 20px;
        }
        .language-switcher button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
        }
        @media (max-width: 600px) {
            .day {
                height: 80px;
            }
            .navigation button, .language-switcher button {
                width: 40%;
                margin: 10px 5%;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Ultraschall-Gefaess-Quiz Logo">
        <h1 id="title">Willkommen beim Ultraschall-Gefäß-Quiz</h1>
        <p id="description">Dies ist eine einfache Projektwebsite, die auf GitHub Pages mit dem Minima-Theme gehostet wird.</p>
    </header>

    <div class="navigation">
        <button onclick="prevMonth()">Vorheriger</button>
        <button onclick="nextMonth()">Nächster</button>
    </div>

    <div class="language-switcher">
        <button onclick="setLanguage('de')">DE</button>
        <button onclick="setLanguage('en')">EN</button>
    </div>

    <div id="calendar-container"></div>

    <script>
        const events = {
            "2024-06-07": { title: "Medical Quiz Event 1", color: "#FF5722" },
            "2024-06-15": { title: "Medical Quiz Event 2", color: "#4CAF50" },
            // Add more events here
        };

        const translations = {
            "de": {
                "title": "Willkommen beim Ultraschall-Gefäß-Quiz",
                "description": "Dies ist eine einfache Projektwebsite, die auf GitHub Pages mit dem Minima-Theme gehostet wird.",
                "previous": "Vorheriger",
                "next": "Nächster",
                "monthNames": ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"],
                "dayNames": ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"]
            },
            "en": {
                "title": "Welcome to Ultrasound Vessel Quiz",
                "description": "This is a simple project website hosted on GitHub Pages using the Minima theme.",
                "previous": "Previous",
                "next": "Next",
                "monthNames": ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
                "dayNames": ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
            }
        };

        let currentLanguage = 'de';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function setLanguage(language) {
            currentLanguage = language;
            document.getElementById('title').innerText = translations[language].title;
            document.getElementById('description').innerText = translations[language].description;
            document.querySelector('.navigation button:nth-child(1)').innerText = translations[language].previous;
            document.querySelector('.navigation button:nth-child(2)').innerText = translations[language].next;
            renderCalendar(currentMonth, currentYear);
        }

        function renderCalendar(month, year) {
            const calendarContainer = document.getElementById('calendar-container');
            calendarContainer.innerHTML = generateCalendarHTML(month, year);
        }

        function generateCalendarHTML(month, year) {
            const date = new Date(year, month);
            const monthName = translations[currentLanguage].monthNames[month];
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const dayNames = translations[currentLanguage].dayNames;

            let html = `
                <table class="calendar">
                    <tr class="month">
                        <th colspan="7">${monthName} ${year}</th>
                    </tr>
                    <tr class="day-header">
                        ${dayNames.map(day => `<th>${day}</th>`).join('')}
                    </tr>
                    <tr>
            `;
            for (let i = 0; i < firstDay; i++) {
                html += `<td class="day"></td>`;
            }
            for (let day = 1; day <= lastDate; day++) {
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += `<td class="day${dateString === new Date().toISOString().slice(0, 10) ? ' today' : ''}">`;
                html += day;
                if (events[dateString]) {
                    html += `<div class="event" style="background-color: ${events[dateString].color};">${events[dateString].title}</div>`;
                }
                html += `</td>`;
                if ((day + firstDay) % 7 === 0) {
                    html += `</tr><tr>`;
                }
            }
            html += `</tr></table>`;
            return html;
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(currentMonth, currentYear);
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar(currentMonth, currentYear);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLanguage);
        });
    </script>
</body>
</html>
